name: Build Mac plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mac-${{ hashFiles('Cargo.lock') }}

      - name: Unit tests
        run: cargo test --release --lib

      - name: Build universal VST3 (Apple Silicon + Intel), ad-hoc signed
        run: cargo xtask bundle-universal reverse_swell --release --features objc-exception-guard

      - name: Inspect bundle
        run: |
          B="target/bundled/Reverse Swell.vst3"
          ls -R "$B"
          lipo -info "$B/Contents/MacOS/Reverse Swell"
          codesign --verify --verbose=2 "$B"
          plutil -p "$B/Contents/Info.plist"

      - name: Build Steinberg VST3 validator
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -j4 https://github.com/steinbergmedia/vst3sdk.git /tmp/vst3sdk
          cmake -S /tmp/vst3sdk -B /tmp/vst3build -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build /tmp/vst3build --target validator -j3

      - name: Validate
        run: |
          V=$(find /tmp/vst3build -name validator -type f -perm -u+x | head -1)
          "$V" "target/bundled/Reverse Swell.vst3" | tee validator.txt
          grep -q "0 tests failed" validator.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audio test in a real VST3 host
        run: |
          pip install pedalboard numpy pyobjc-framework-Quartz
          python ci/host_test.py "target/bundled/Reverse Swell.vst3"

      # GitHub's Macs are VMs without a GPU, so hardware-accelerated OpenGL (which the real
      # plugin asks for, and every real Mac has) isn't available. For the GUI test only, build a
      # throwaway copy that accepts Apple's software renderer. The shipped plugin is untouched.
      - name: Build test-only copy with software OpenGL
        run: |
          F=$(ls -d ~/.cargo/git/checkouts/baseview-*/9a0b42c/src/gl/macos.rs)
          cp "$F" /tmp/macos.rs.orig
          sed -i '' '/NSOpenGLPFAAccelerated as u32,/d' "$F"
          CARGO_TARGET_DIR=/tmp/guitest cargo build --release --lib --features objc-exception-guard || STATUS=$?
          cp /tmp/macos.rs.orig "$F"
          [ -z "$STATUS" ] || exit $STATUS
          mkdir -p /tmp/gui
          cp -R "target/bundled/Reverse Swell.vst3" /tmp/gui/
          cp /tmp/guitest/release/libreverse_swell.dylib "/tmp/gui/Reverse Swell.vst3/Contents/MacOS/Reverse Swell"
          codesign -f -s - "/tmp/gui/Reverse Swell.vst3"

      - name: GUI and drag-out test
        continue-on-error: true
        run: |
          mkdir -p screenshots
          python ci/mac_gui_test.py "/tmp/gui/Reverse Swell.vst3" screenshots

      - name: Package
        run: |
          mkdir -p dist
          cp README_MAC.txt dist/
          ditto -c -k --keepParent "target/bundled/Reverse Swell.vst3" "dist/Reverse Swell.vst3.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Reverse_Swell_Mac
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            screenshots/
            validator.txt

      # Also publish the plugin and test output to the ci-output branch, so they can be fetched
      # with plain git
      - name: Publish to ci-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -R dist screenshots validator.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b ci-output
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output
